name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splitmate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d splitmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/splitmate_test
      JWT_SECRET_KEY: splitmate-ci-jwt-secret-12345678901234567890

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

    containers:
    name: Container build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: splitmate-ci-jwt-secret-12345678901234567890

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate Swarm monitoring configuration
        run: docker stack config -c deploy/swarm-local.yaml > /dev/null

      - name: Validate production Swarm configuration
        env:
          DOMAIN: splitmate.example.com
          API_IMAGE: ghcr.io/example/splitmate-api:ci
          CADDY_IMAGE: ghcr.io/example/splitmate-caddy:ci
        run: docker stack config -c deploy/swarm-stack.yaml > /dev/null

      - name: Build application containers
        run: docker compose build
