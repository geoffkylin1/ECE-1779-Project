services:
  caddy:
    image: splitmate-caddy:latest
    environment:
      SITE_ADDRESS: :80
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - swarm_caddy_data:/data
      - swarm_caddy_config:/config
    networks:
      - edge
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      restart_policy:
        condition: on-failure

  api:
    image: splitmate-api:latest
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - database_url
      - jwt_secret
    ports:
      - target: 8000
        published: 8001
        protocol: tcp
        mode: ingress
    networks:
      - edge
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        monitor: 20s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s

  migrate:
    image: splitmate-api:latest
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    command:
      - /bin/sh
      - -c
      - |
        until alembic upgrade head; do
          echo "Waiting for PostgreSQL before migration..."
          sleep 2
        done
    networks:
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: splitmate
      POSTGRES_USER: splitmate
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - swarm_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

secrets:
  database_url:
    external: true
    name: splitmate_local_database_url
  jwt_secret:
    external: true
    name: splitmate_local_jwt_secret
  postgres_password:
    external: true
    name: splitmate_local_postgres_password

volumes:
  swarm_postgres_data:
  swarm_caddy_data:
  swarm_caddy_config:

networks:
  edge:
    driver: overlay
  data:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"